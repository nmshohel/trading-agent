# ==============================================================================
# Nginx Reverse Proxy + TLS + Unbuffered SSE Config — Personal AI Trading Agent
# ==============================================================================
# Keeps Next.js (apps/web) and Express (apps/api) on the SAME origin so
# HTTP-only cookies, CSRF headers, and EventSource (/api/v1/stream) work cleanly
# without cross-origin credential pitfalls.

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=trade_action_limit:10m rate=30r/m;

upstream web_upstream {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream api_upstream {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name trading.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trading.example.com;

    ssl_certificate     /etc/letsencrypt/live/trading.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Block internal worker endpoints from public internet — allow private worker IP only
    location /api/internal/ {
        allow 127.0.0.1;
        # allow 10.0.0.20; # Replace with private VPN / WireGuard IP of Windows MT5 host
        deny all;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authenticated SSE stream — MUST disable proxy buffering!
    location = /api/v1/stream {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
    }

    # Strict rate limit on login
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strict rate limit on approve / manual close / kill switch
    location ~ ^/api/v1/(proposals/[^/]+/(approve|reject)|positions/[^/]+/close|system/kill-switch)$ {
        limit_req zone=trade_action_limit burst=10 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public liveness probe
    location = /api/health {
        proxy_pass http://api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # All other API endpoints
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js dashboard
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
